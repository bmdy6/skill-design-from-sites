<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Crop bounds fixture</title>
<style>
  body { margin: 0; min-height: 11000px; }
  div { position: absolute; width: 80px; height: 40px; }
  #outside { left: 10px; top: -100px; color: rgb(11, 22, 33); }
  #partial { left: -20px; top: -10px; color: rgb(44, 55, 66); }
  #limit { left: 10px; top: 9990px; color: rgb(77, 88, 99); }
  #normal { left: 10px; top: 100px; color: rgb(111, 122, 133); }
</style>
<body>
<div id="outside">Outside</div>
<div id="partial">Partial</div>
<div id="limit">Limit</div>
<div id="normal">Normal</div>
</body>
</html>
